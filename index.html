<!DOCTYPE html>

<head>
    <meta charset="UTF-8" />

    <title>Q' Limpio - Gestión de Lavandería</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Mobile Drag and Drop Polyfill -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/default.css">
    <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/index.min.js"></script>
    <script>
        try {
            MobileDragDrop.polyfill({
                dragImageTranslateOverride: MobileDragDrop.scrollBehaviourDragImageTranslateOverride
            });
            window.addEventListener( 'touchmove', function() {}, {passive: false});
        } catch (e) {
            console.warn("Mobile Drag Drop Polyfill could not be initialized", e);
        }
    </script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'primary': '#4A90E2',      
              'accent': '#F5A623',      
              'text-main': '#333333',   
              'text-secondary': '#888888', 
              'background-light': '#F0F2F5', 
              'status-green': '#2ECC71',
              'status-yellow': '#F1C40F',
              'status-red': '#E74C3C',
              'kanban-col': '#FAFAFB',
            },
            fontFamily: {
              'sans': ['Roboto', 'sans-serif'],
              'display': ['Montserrat', 'sans-serif'],
            }
          }
        }
      }
    </script>
